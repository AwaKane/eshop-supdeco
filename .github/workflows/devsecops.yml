name: DevSecOps Pipeline — E-Shop Pro
# SUP de CO Dakar — Cours 2INF2311

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ═══════════════════════════════════════════════════════
  # JOB 1 — SAST : Analyse statique avec Semgrep
  # ═══════════════════════════════════════════════════════
  sast:
    name: SAST — Semgrep
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep SAST
        run: |
          pip install semgrep
          semgrep scan \
            --config=p/owasp-top-ten \
            --config=p/nodejs \
            --config=p/secrets \
            --config=p/sql-injection \
            --config=p/javascript \
            --config=.semgrep/ \
            --sarif --output=semgrep.sarif .
        continue-on-error: true

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif

  # ═══════════════════════════════════════════════════════
  # JOB 2 — SCA : Analyse des dépendances avec Snyk
  # ═══════════════════════════════════════════════════════
  sca-snyk:
    name: SCA — Snyk Dependencies
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm install

      - name: Run Snyk vulnerability scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --sarif-file-output=snyk.sarif

      - name: Créer SARIF vide si absent
        run: |
          if [ ! -f snyk.sarif ]; then
            echo '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[{"tool":{"driver":{"name":"Snyk","rules":[]}},"results":[]}]}' > snyk.sarif
          fi

      - name: Upload Snyk SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: snyk.sarif

      - name: Snyk summary
        continue-on-error: true
        run: npx snyk test --severity-threshold=high || true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  # ═══════════════════════════════════════════════════════
  # JOB 3 — SCA : Scan filesystem avec Trivy
  # ═══════════════════════════════════════════════════════
  sca-trivy-fs:
    name: SCA — Trivy Filesystem
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: "."
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "0"

      - name: Upload Trivy FS SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-fs.sarif

      - name: Trivy table output
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: "."
          format: table
          severity: CRITICAL,HIGH

  # ═══════════════════════════════════════════════════════
  # JOB 4 — BUILD Docker image
  # ═══════════════════════════════════════════════════════
  build:
    name: Build — Docker Image
    runs-on: ubuntu-latest
    needs: [sast, sca-snyk, sca-trivy-fs]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t eshop-pro:${{ github.sha }} .
          docker tag eshop-pro:${{ github.sha }} eshop-pro:latest

      - name: Save image for next job
        run: docker save eshop-pro:${{ github.sha }} -o eshop-image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: eshop-image.tar
          retention-days: 1

  # ═══════════════════════════════════════════════════════
  # JOB 5 — Scan image Docker avec Trivy
  # ═══════════════════════════════════════════════════════
  scan-image:
    name: Trivy — Image Scan
    runs-on: ubuntu-latest
    needs: build
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image
        run: docker load -i eshop-image.tar

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: eshop-pro:${{ github.sha }}
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload Trivy image SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image.sarif

      - name: Trivy image table output
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: eshop-pro:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: eshop-pro:${{ github.sha }}
          format: cyclonedx
          output: sbom.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

  # ═══════════════════════════════════════════════════════
  # JOB 6 — Résumé de sécurité
  # ═══════════════════════════════════════════════════════
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [sast, sca-snyk, sca-trivy-fs, scan-image]
    if: always()

    steps:
      - name: Security pipeline summary
        run: |
          echo "## 🔒 DevSecOps Pipeline — E-Shop Pro" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Statut |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| SAST (Semgrep) | ${{ needs.sast.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SCA Snyk | ${{ needs.sca-snyk.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SCA Trivy FS | ${{ needs.sca-trivy-fs.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Trivy Image | ${{ needs.scan-image.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📋 Voir l'onglet **Security** pour les détails." >> $GITHUB_STEP_SUMMARY
